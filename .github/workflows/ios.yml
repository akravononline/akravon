name: ios

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15-intel   # Apple Silicon havuzunda kapasite yoktu (is hic baslamiyordu); Intel havuzu iOS arm64 icin capraz derler
    steps:
      - uses: actions/checkout@v4

      - name: Yapilandir (cmake + Xcode)
        run: |
          cmake -S mobile/ios -B build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0

      - name: Derle
        run: |
          set -o pipefail
          cmake --build build --config Release -- -quiet CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee derleme.log
          test -d build/Release-iphoneos/cynexmobil.app

      - name: Hatalar (ozet)
        if: failure()
        run: |
          grep -E 'error:|fatal error|ld: |Undefined symbols' derleme.log | sed 's#/Users/runner/work/akravon/akravon/##' | sort -u | head -45 | while IFS= read -r line; do echo "::error::${line}"; done
          true

      - name: IPA paketle (imzasiz)
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/cynexmobil.app Payload/AKRAVON.app
          zip -qr AKRAVON.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: AKRAVON-ipa
          path: AKRAVON.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derleme-gunlugu
          path: derleme.log
